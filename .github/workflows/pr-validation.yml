name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, types, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Run LEAPS and PMCC safety tests
        run: |
          npm test -- \
            lib/portfolio/__tests__/leapsPositionIntelligence.test.ts \
            lib/portfolio/__tests__/pmccCampaign.test.ts \
            lib/portfolio/__tests__/pmccLongCloseSubmission.test.ts \
            lib/portfolio/__tests__/pmccPersistedLongClose.test.ts \
            lib/portfolio/__tests__/closeOrderPmccIntegration.test.ts \
            features/portfolio/positions-workspace/__tests__/pmccIntegration.test.ts
        timeout-minutes: 5

      - name: Run Positions Workspace regression
        run: npm test -- features/portfolio/positions-workspace/__tests__/PositionsWorkspace.test.tsx
        timeout-minutes: 5

      - name: Run Portfolio page regression in isolation
        run: npm test -- app/portfolio/__tests__/PortfolioPage.test.tsx
        env:
          DEBUG_PRINT_LIMIT: 50000
        timeout-minutes: 5

      - name: Run complete test suite
        run: npm test
        timeout-minutes: 5

      - name: Run TypeScript check
        run: npx tsc --noEmit
        timeout-minutes: 5

      - name: Run production build
        run: npm run build
        timeout-minutes: 5
