<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeEdge · Unified scan configuration</title>
<style>
:root{--bg:#090a0b;--card:#171819;--card2:#1d1f20;--line:#363839;--text:#f3f4f5;--muted:#a2a6aa;--faint:#777c80;--teal:#4ee7d5;--amber:#ffc434;--red:#ff7a78;--blue:#8fc3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}.shell{max-width:1180px;margin:28px auto;padding:0 18px}.review{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.review button,.chip{color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-weight:700;cursor:pointer}.review button[aria-pressed=true],.chip.on{border-color:var(--teal);color:var(--teal);background:#123c39}.page{border:1px solid #292b2c;border-radius:20px;background:#101112;min-height:800px;padding:30px}.top{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:22px}.eyebrow{font-size:11px;color:var(--teal);font-weight:800;letter-spacing:.12em}.top h1{margin:5px 0 3px;font-size:25px;letter-spacing:.05em}.sub{color:var(--muted);margin:0}.scope{border:1px solid var(--line);border-radius:10px;padding:11px 14px;min-width:240px}.scope b{display:block}.scope span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 310px;gap:22px;margin-top:22px}.main{display:grid;gap:14px}.section{border:1px solid var(--line);border-radius:13px;padding:17px;background:var(--card)}.section h2{font-size:13px;letter-spacing:.09em;margin:0 0 3px;text-transform:uppercase}.hint{margin:0 0 14px;color:var(--muted);font-size:12px}.mode,.presets,.chips,.quick{display:flex;gap:8px;flex-wrap:wrap}.mode button{flex:1;min-width:120px;text-align:left;padding:11px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--muted);font:inherit;font-weight:800}.mode button.on{border-color:var(--teal);background:#143b38;color:var(--teal)}.mode small{display:block;font-weight:400;margin-top:4px;color:inherit;opacity:.8}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.input{border:1px solid var(--line);background:#101112;border-radius:8px;padding:10px;color:var(--text);font-weight:700;width:100%}.unit{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end}.suffix{padding:10px 0;color:var(--muted);font-size:12px}.quick{margin-top:10px;align-items:center}.quick span{font-size:10px;color:var(--faint);font-weight:800;letter-spacing:.06em;text-transform:uppercase}.quick button{background:#111213;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:11px;font-weight:800}.quick button.on{background:#123c39;border-color:var(--teal);color:var(--teal)}.quick button.off{color:#a2a6aa;margin:0}.custom{font-size:11px;color:var(--faint);margin:10px 0 0}.custom b{color:var(--muted)}.callout{font-size:12px;border-left:3px solid var(--teal);padding:9px 11px;background:#122927;color:#d4f8f2}.callout.warn{border-color:var(--amber);background:#372c13;color:#ffe39a}.check{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:12px}.check:first-of-type{border-top:0}.check i{color:var(--teal);font-style:normal;font-weight:900}.side{position:sticky;top:16px;height:max-content}.summary{background:#131b1b;border-color:#28635c}.summary dl{margin:12px 0}.summary dt{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em}.summary dd{margin:2px 0 10px;font-weight:700}.run{width:100%;background:var(--amber);border:0;border-radius:9px;padding:13px;color:#161004;font-weight:900;font-size:14px;cursor:pointer}.reset{width:100%;background:transparent;border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--muted);font-weight:700;margin-top:8px}.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--faint);font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.fetch{background:var(--blue)}.gate{background:var(--teal)}.rank{background:#cba7ff}.filter{background:var(--amber)}.tag{display:inline-block;font-size:10px;border-radius:20px;padding:3px 7px;margin-left:6px}.tag.fetch{background:#1e2c3a;color:var(--blue)}.tag.gate{background:#143b38;color:var(--teal)}.tag.rank{background:#30243d;color:#cba7ff}.tag.filter{background:#3b3013;color:#ffe18a}.off{color:var(--faint);font-size:11px;margin-top:5px}.disabled{opacity:.5;cursor:not-allowed}.zero{display:none}.zero .section{border-color:#785b16}.zero .run{background:#55504a;color:#b9b4aa}.strategy-note{font-size:11px;color:var(--faint);margin-top:10px}@media(max-width:780px){.grid{grid-template-columns:1fr}.side{position:static}.fields{grid-template-columns:1fr 1fr}.top{display:block}.scope{margin-top:16px}}@media(max-width:480px){.page{padding:18px}.fields{grid-template-columns:1fr}}
</style></head><body><main class="shell"><div class="review" aria-label="Configuration screens"><button aria-pressed="true" data-screen="spreads">Targeted spreads</button><button aria-pressed="false" data-screen="csp">Cash-secured put</button><button aria-pressed="false" data-screen="cc">Covered call</button><button aria-pressed="false" data-screen="pmcc">PMCC</button><button aria-pressed="false" data-screen="leaps">LEAPS</button><button aria-pressed="false" data-screen="zero">Zero eligible state</button></div><div id="host"></div></main>
<template id="common"><div class="top"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1 data-title></h1><p class="sub" data-sub></p></div><div class="scope"><b data-scope></b><span data-scope-help></span></div></div></template>
<template id="spreads"><div class="page"><div class="top"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>SPREADS · TARGETED SCAN</h1><p class="sub">Start with a clear search intent, then refine only the economics that apply to defined-risk spreads.</p></div><div class="scope"><b>44 selected tickers</b><span>Opportunity Universe · broker fetch required</span></div></div><div class="grid"><div class="main"><section class="section"><h2>Search intent</h2><p class="hint">Targeted scan is selected. Filter and Rank remain available when you want a different outcome.</p><div class="mode"><button>FILTER<small>Apply rules as pass/fail gates</small></button><button>RANK<small>Score the whole fetched universe</small></button><button class="on">TARGETED<small>Find a deliberately narrow trade area</small></button></div></section><section class="section"><h2>Profile</h2><p class="hint">A profile applies recommended values; every field remains editable.</p><div class="presets"><button class="chip">Strict</button><button class="chip on">Course</button><button class="chip">Relaxed</button><button class="chip">Low volatility</button><button class="chip">Short term</button></div></section><section class="section"><h2>Time & distance</h2><div class="fields"><div class="field"><label>DTE range <span class="tag fetch">FETCH</span></label><div class="unit"><div class="input">30 – 45</div><span class="suffix">days</span></div></div><div class="field"><label>Minimum POP <span class="tag gate">GATE</span></label><div class="unit"><div class="input">70</div><span class="suffix">%</span></div></div><div class="field"><label>Minimum OTM <span class="tag gate">GATE</span></label><div class="unit"><div class="input">8</div><span class="suffix">%</span></div></div></div></section><section class="section"><h2>Return & risk</h2><div class="fields"><div class="field"><label>Minimum credit / risk <span class="tag gate">GATE</span></label><div class="unit"><div class="input">20</div><span class="suffix">% of width</span></div><p class="off">Choose “Any” to remove this gate.</p></div><div class="field"><label>Minimum IVR <span class="tag gate">GATE</span></label><div class="unit"><div class="input">Any</div><span class="suffix">off</span></div></div><div class="field"><label>Minimum relevant-leg OI <span class="tag gate">GATE</span></label><div class="unit"><div class="input">500</div><span class="suffix">contracts</span></div></div></div></section><section class="section"><h2>Always applied</h2><div class="check"><i>✓</i><span>Earnings before expiration disqualifies a candidate.</span></div><div class="check"><i>✓</i><span>Bid/ask quality is checked before a candidate is shown.</span></div><div class="check"><i>✓</i><span>Iron condors use the tighter OTM side.</span></div></section></div><aside class="side section summary"><div class="legend"><span><i class="dot fetch"></i>Fetch boundary</span><span><i class="dot gate"></i>Qualification gate</span><span><i class="dot rank"></i>Ranking preference</span><span><i class="dot filter"></i>Result filter</span></div><h2 style="margin-top:16px">Scan summary</h2><dl><dt>Universe</dt><dd>44 tickers</dd><dt>Fetch</dt><dd>30–45 DTE</dd><dt>Must qualify</dt><dd>POP ≥ 70% · OTM ≥ 8% · credit/risk ≥ 20%</dd><dt>Results can be filtered later</dt><dd>Credit ratio, OI, POP, OTM</dd></dl><button class="run">RUN TARGETED SPREAD SCAN →</button><button class="reset">Reset to Course profile</button></aside></div></div></template>
<template id="csp"><div class="page"><div class="top"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>CASH-SECURED PUT · TARGETED SCAN</h1><p class="sub">Search cash-secured puts using return on committed cash—not spread credit/risk.</p></div><div class="scope"><b>44 selected tickers</b><span>Account capital will be verified</span></div></div><div class="grid"><div class="main"><section class="section"><h2>Search intent</h2><div class="mode"><button>FILTER<small>Apply CSP qualification rules</small></button><button>RANK<small>Order qualified CSPs by score</small></button><button class="on">TARGETED<small>Search a narrowed CSP area</small></button></div></section><section class="section"><h2>Profile</h2><p class="hint">Profiles set both the discovery range and targeted criteria.</p><div class="presets"><button class="chip">Strict</button><button class="chip on">Course</button><button class="chip">Relaxed</button><button class="chip">Low volatility</button><button class="chip">Short term</button></div></section><section class="section"><h2>Time, distance & probability</h2><div class="fields"><div class="field"><label>DTE range <span class="tag fetch">FETCH</span></label><div class="unit"><div class="input">30 – 45</div><span class="suffix">days</span></div></div><div class="field"><label>Short-put delta range <span class="tag gate">GATE</span></label><div class="input">0.15 – 0.25</div></div><div class="field"><label>Minimum POP <span class="tag gate">GATE</span></label><div class="unit"><div class="input">70</div><span class="suffix">%</span></div></div><div class="field"><label>Minimum OTM <span class="tag gate">GATE</span></label><div class="unit"><div class="input">8</div><span class="suffix">%</span></div></div><div class="field"><label>IVR range <span class="tag gate">GATE</span></label><div class="input">30 – 70 %</div></div></div></section><section class="section"><h2>Return, liquidity & capital</h2><div class="fields"><div class="field"><label>Minimum period ROC <span class="tag gate">GATE</span></label><div class="unit"><div class="input">1.5</div><span class="suffix">% per period</span></div></div><div class="field"><label>Minimum OI <span class="tag gate">GATE</span></label><div class="unit"><div class="input">500</div><span class="suffix">contracts</span></div></div><div class="field"><label>Maximum bid/ask width <span class="tag gate">GATE</span></label><div class="unit"><div class="input">0.10</div><span class="suffix">$ per share</span></div></div></div><div class="callout">Capital eligibility: each candidate is checked against available cash. “Affordable only” is always on for a capital-aware CSP scan.</div></section><section class="section"><h2>Always applied</h2><div class="check"><i>✓</i><span>Earnings before expiration disqualifies the put.</span></div><div class="check"><i>✓</i><span>Connected-broker cash is the source of truth for affordability.</span></div></section></div><aside class="side section summary"><h2>Scan summary</h2><dl><dt>Fetch</dt><dd>30–45 DTE</dd><dt>Must qualify</dt><dd>Δ .15–.25 · POP ≥ 70% · OTM ≥ 8% · ROC ≥ 1.5%</dd><dt>Capital</dt><dd>Must be affordable in selected account</dd></dl><button class="run">RUN CSP SCAN →</button><button class="reset">Reset to Course profile</button></aside></div></div></template>
<template id="cc"><div class="page"><div class="top"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>COVERED CALL SCAN</h1><p class="sub">Find calls only against broker-verified covered share lots. This is a holdings search, not a watchlist scan.</p></div><div class="scope"><b>12 eligible share lots</b><span>Across 8 held symbols</span></div></div><div class="grid"><div class="main"><section class="section"><h2>Time & strike distance</h2><div class="fields"><div class="field"><label>DTE range <span class="tag fetch">FETCH</span></label><div class="unit"><div class="input">21 – 45</div><span class="suffix">days</span></div></div><div class="field"><label>Call delta range <span class="tag gate">GATE</span></label><div class="input">0.20 – 0.35</div></div><div class="field"><label>Strike guard <span class="tag gate">GATE</span></label><div class="input">Above cost basis & current price</div></div></div></section><section class="section"><h2>Liquidity</h2><div class="fields"><div class="field"><label>Minimum OI <span class="tag gate">GATE</span></label><div class="unit"><div class="input">100</div><span class="suffix">contracts</span></div></div><div class="field"><label>Maximum bid/ask width <span class="tag gate">GATE</span></label><div class="unit"><div class="input">0.20</div><span class="suffix">$ per share</span></div></div></div></section><section class="section"><h2>Always applied</h2><div class="check"><i>✓</i><span>Share coverage is verified by lot; a watchlist cannot create coverage.</span></div><div class="check"><i>✓</i><span>Earnings before expiration disqualifies the call.</span></div><div class="check"><i>✓</i><span>Results are grouped by holding, so coverage and cost basis remain visible.</span></div></section></div><aside class="side section summary"><h2>Scan summary</h2><dl><dt>Source</dt><dd>12 broker-verified share lots</dd><dt>Fetch</dt><dd>21–45 DTE</dd><dt>Must qualify</dt><dd>Δ .20–.35 · OI ≥ 100 · width ≤ $0.20</dd><dt>Automatic guard</dt><dd>Strike clears cost basis and current price</dd></dl><button class="run">RUN COVERED CALL SCAN →</button><button class="reset">Reset defaults</button></aside></div></div></template>
<template id="pmcc"><div class="page"><div class="top"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>PMCC SCAN</h1><p class="sub">Pair a long-dated call with a shorter call. Long and short criteria are intentionally kept separate.</p></div><div class="scope"><b>6 eligible long calls</b><span>Broker-verified positions available for pairing</span></div></div><div class="grid"><div class="main"><section class="section"><h2>Short call · income leg</h2><div class="fields"><div class="field"><label>DTE range <span class="tag fetch">FETCH</span></label><div class="unit"><div class="input">21 – 45</div><span class="suffix">days</span></div></div><div class="field"><label>Delta range <span class="tag gate">GATE</span></label><div class="input">0.20 – 0.35</div></div><div class="field"><label>Minimum OI <span class="tag gate">GATE</span></label><div class="unit"><div class="input">100</div><span class="suffix">contracts</span></div></div></div></section><section class="section"><h2>Long call · foundation leg</h2><div class="fields"><div class="field"><label>DTE range <span class="tag fetch">FETCH</span></label><div class="unit"><div class="input">180 – 730</div><span class="suffix">days</span></div></div><div class="field"><label>Delta range <span class="tag gate">GATE</span></label><div class="input">0.70 – 0.85</div></div><div class="field"><label>Minimum OI <span class="tag gate">GATE</span></label><div class="unit"><div class="input">100</div><span class="suffix">contracts</span></div></div></div></section><section class="section"><h2>Pair construction</h2><div class="fields"><div class="field"><label>Net debit below strike width <span class="tag gate">GATE</span></label><div class="input">Required</div></div><div class="field"><label>Trend alignment <span class="tag gate">GATE</span></label><div class="input">Required</div></div></div><p class="strategy-note">Turn either condition off explicitly. Off conditions appear as “Not required” in the scan summary and near-misses remain auditable.</p></section><section class="section"><h2>Always applied</h2><div class="check"><i>✓</i><span>Underlying and deliverable must match; long expiration is later and strike is lower.</span></div><div class="check"><i>✓</i><span>Quote freshness and bid/ask quality are enforced by the pairing engine.</span></div></section></div><aside class="side section summary"><h2>Scan summary</h2><dl><dt>Eligible foundations</dt><dd>6 held long calls</dd><dt>Short-leg fetch</dt><dd>21–45 DTE · Δ .20–.35</dd><dt>Long-leg fetch</dt><dd>180–730 DTE · Δ .70–.85</dd><dt>Pair gates</dt><dd>Debit below width · trend aligned</dd></dl><button class="run">RUN PMCC SCAN →</button><button class="reset">Reset defaults</button></aside></div></div></template>
<template id="leaps"><div class="page"><div class="top"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>LEAPS SCAN</h1><p class="sub">Find long-dated calls from the Opportunity Universe. These are candidate foundations, not a covered-call holdings search.</p></div><div class="scope"><b>44 selected tickers</b><span>Opportunity Universe · broker fetch required</span></div></div><div class="grid"><div class="main"><section class="section"><h2>Time & exposure</h2><div class="fields"><div class="field"><label>DTE range <span class="tag fetch">FETCH</span></label><div class="unit"><div class="input">180 – 730</div><span class="suffix">days</span></div></div><div class="field"><label>Delta range <span class="tag gate">GATE</span></label><div class="input">0.70 – 0.85</div></div><div class="field"><label>Minimum OI <span class="tag gate">GATE</span></label><div class="unit"><div class="input">100</div><span class="suffix">contracts</span></div></div></div></section><section class="section"><h2>Option value</h2><div class="fields"><div class="field"><label>Maximum extrinsic value <span class="tag gate">GATE</span></label><div class="input">No cap</div><p class="off">Off — select a percentage only when you want to reject higher-extrinsic contracts.</p></div><div class="field"><label>Recommended result sort <span class="tag rank">RANK</span></label><div class="input">Highest delta, then liquidity</div></div></div></section><section class="section"><h2>Always applied</h2><div class="check"><i>✓</i><span>Contracts must be calls with valid quote data and open interest.</span></div><div class="check"><i>✓</i><span>Result cards disclose intrinsic and extrinsic value for comparison.</span></div></section></div><aside class="side section summary"><h2>Scan summary</h2><dl><dt>Universe</dt><dd>44 tickers</dd><dt>Fetch</dt><dd>180–730 DTE</dd><dt>Must qualify</dt><dd>Δ .70–.85 · OI ≥ 100</dd><dt>Extrinsic cap</dt><dd>Off (No cap)</dd></dl><button class="run">RUN LEAPS SCAN →</button><button class="reset">Reset defaults</button></aside></div></div></template>
<template id="zero"><div class="page"><div class="top"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>COVERED CALL SCAN</h1><p class="sub">A holdings-based search needs broker-confirmed share coverage before configuration can run.</p></div><div class="scope"><b>0 eligible share lots</b><span>Connected account checked</span></div></div><div class="grid"><div class="main"><section class="section"><h2>No eligible covered-call holdings</h2><p class="hint">We could not find a stock position with at least 100 uncovered shares in the connected account.</p><div class="callout warn"><b>What to do next</b><br>Refresh your broker connection, choose another account, or use the Spreads/CSP/LEAPS scanner for the selected universe. Configuration is preserved but cannot run until coverage exists.</div></section><section class="section"><h2>Read-only defaults</h2><div class="fields"><div class="field"><label>DTE range</label><div class="input">21 – 45 days</div></div><div class="field"><label>Call delta range</label><div class="input">0.20 – 0.35</div></div><div class="field"><label>Minimum OI</label><div class="input">100 contracts</div></div></div></section></div><aside class="side section summary"><h2>Scan unavailable</h2><dl><dt>Eligibility</dt><dd>0 verified covered lots</dd><dt>Next action</dt><dd>Refresh broker data or select another account</dd></dl><button class="run disabled" disabled>RUN COVERED CALL SCAN</button><button class="reset">Refresh eligibility</button></aside></div></div></template>
<script>const host=document.querySelector('#host'),buttons=[...document.querySelectorAll('.review button')];const selections={'DTE range':['7–13','14–20','21–29','30–45','46–60'],'Minimum POP':['Any','65%','70%','75%','80%'],'Minimum OTM':['Any','4%','8%','12%','16%','20%'],'Minimum credit / risk':['Any','15%','20%','25%','33%'],'Minimum IVR':['Any','20%','30%','40%','50%'],'IVR range':['Any','10–50%','20–70%','30–70%'],'Minimum relevant-leg OI':['100','200','300','500'],'Minimum OI':['100','200','300','500'],'Maximum bid/ask width':['$0.05','$0.10','$0.20','Custom'],'Minimum period ROC':['Any','0.8%','1.2%','1.5%','2.0%'],'Short-put delta range':['0.10–0.16','0.15–0.25','0.20–0.35','Custom'],'Call delta range':['0.15–0.25','0.20–0.35','0.30–0.45','Custom'],'Delta range':['0.60–0.75','0.70–0.85','0.80–0.90','Custom'],'Maximum extrinsic value':['No cap','20%','30%','40%','Custom']};function enhance(){host.querySelectorAll('.field').forEach(field=>{let label=field.querySelector('label');if(!label)return;let key=[...Object.keys(selections)].find(k=>label.textContent.trim().startsWith(k));if(!key)return;let quick=document.createElement('div');quick.className='quick';quick.innerHTML='<span>Quick select</span>'+selections[key].map((x,i)=>'<button class="'+((label.textContent.includes('DTE')&&x==='30–45')||(key==='Minimum POP'&&x==='70%')||(key==='Minimum OTM'&&x==='8%')||(key==='Minimum credit / risk'&&x==='20%')||(key==='Minimum IVR'&&x==='Any')||(key==='IVR range'&&x==='30–70%')||(key.includes('OI')&&x==='500')||(key==='Minimum period ROC'&&x==='1.5%')||(key.includes('delta')&&x==='0.20–0.35')||(key==='Delta range'&&x==='0.70–0.85')||(key==='Maximum extrinsic value'&&x==='No cap')||(key==='Maximum bid/ask width'&&x==='$0.10')?'on':'')+'">'+x+'</button>').join('');quick.querySelectorAll('button').forEach(b=>b.onclick=()=>{quick.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});field.appendChild(quick)});host.querySelectorAll('.section').forEach(s=>{if(s.querySelector('.quick')&&!s.querySelector('.custom')){let p=document.createElement('p');p.className='custom';p.innerHTML='<b>Custom override:</b> enter a value or range above when no quick selection fits. The chosen pill changes to Custom.';s.appendChild(p)}})}function show(id){host.replaceChildren(document.querySelector('#'+id).content.cloneNode(true));enhance();buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===id)))}buttons.forEach(b=>b.onclick=()=>show(b.dataset.screen));show('spreads');</script></body></html>
