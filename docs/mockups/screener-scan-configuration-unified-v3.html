<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screener configuration v3</title><style>
:root{--bg:#090a0b;--card:#171819;--input:#0f1112;--line:#3a3d3f;--text:#f5f6f6;--muted:#a1a6aa;--faint:#747a7e;--teal:#52e4d2;--amber:#ffc437;--blue:#9ecbff;--purple:#d3b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.wrap{max-width:1160px;margin:28px auto;padding:0 16px}.tabs,.pills{display:flex;gap:7px;flex-wrap:wrap}.tabs{margin-bottom:15px}.tabs button,.pill{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);font:700 12px inherit;cursor:pointer}.tabs button[aria-pressed=true],.pill[aria-pressed=true]{background:#123d39;border-color:var(--teal);color:var(--teal)}.pill.off{border-style:dashed}.frame{padding:28px;min-height:760px;border:1px solid #2a2c2e;border-radius:20px;background:#101112}.head{display:flex;justify-content:space-between;gap:18px;padding-bottom:20px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:900;color:var(--teal)}h1{font-size:24px;letter-spacing:.05em;margin:4px 0}.sub{margin:0;color:var(--muted)}.scope{min-width:250px;padding:11px 13px;border:1px solid var(--line);border-radius:10px}.scope b{display:block}.scope span{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin-top:20px}.body{display:grid;gap:13px}.card{padding:16px;border:1px solid var(--line);border-radius:13px;background:var(--card)}h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px}.hint,.manual{font-size:12px;color:var(--muted);margin:0 0 12px}.manual{margin-top:9px;color:var(--faint)}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.control{width:100%;min-height:42px;padding:9px 10px;color:var(--text);border:1px solid var(--line);border-radius:8px;background:var(--input);font:800 14px inherit}.control:focus{outline:2px solid var(--teal);outline-offset:2px}.control:disabled{opacity:.6}.unit{font-size:11px;color:var(--faint);margin-top:4px}.rowlabel{font-size:10px;font-weight:900;color:var(--faint);letter-spacing:.09em;text-transform:uppercase;margin:13px 0 6px}.tag{margin-left:5px;padding:2px 6px;border-radius:12px;font-size:9px;font-weight:900;letter-spacing:.04em}.fetch{background:#1d2e3d;color:var(--blue)}.pref{background:#302740;color:var(--purple)}.gate{background:#153d38;color:var(--teal)}.guard{background:#3b3217;color:#ffe28d}.check{padding:8px 0;border-top:1px solid var(--line);font-size:12px}.check:first-of-type{border-top:0}.check b{color:var(--teal);margin-right:7px}.summary{height:max-content;position:sticky;top:14px;background:#131d1c;border-color:#28645c}.summary dl{margin:13px 0}.summary dt{font-size:10px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}.summary dd{margin:2px 0 10px;font-weight:800}.run,.secondary{width:100%;padding:12px;border-radius:9px;font-size:13px;font-weight:900}.run{border:0;background:var(--amber);color:#1a1303}.secondary{margin-top:8px;border:1px solid var(--line);background:transparent;color:var(--muted)}.notice{padding:10px 12px;border-left:3px solid var(--amber);border-radius:5px;background:#382d15;color:#ffe39d;font-size:12px}.disabled{opacity:.55}.unavailable .card{border-color:#715a1b}@media(max-width:760px){.head,.layout{display:block}.scope{margin-top:14px}.summary{position:static;margin-top:14px}.fields{grid-template-columns:1fr 1fr}}@media(max-width:480px){.frame{padding:18px}.fields{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><nav class="tabs" aria-label="Mockup screens"><button data-v="spreads" aria-pressed="true">Targeted Spreads</button><button data-v="csp" aria-pressed="false">Cash-Secured Put</button><button data-v="cc" aria-pressed="false">Covered Call</button><button data-v="pmcc" aria-pressed="false">PMCC</button><button data-v="leaps" aria-pressed="false">LEAPS</button><button data-v="zero" aria-pressed="false">Zero eligible</button></nav><div id="host"></div></main>
<template id="spreads"><div class="frame"><header class="head"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>SPREADS · TARGETED SCAN</h1><p class="sub">Defined-risk spreads with targeted qualification gates.</p></div><div class="scope"><b>44 selected tickers</b><span>Opportunity Universe · broker fetch required</span></div></header><div class="layout"><div class="body"><section class="card"><h2>Search intent</h2><div class="pills" role="radiogroup" aria-label="Spread search intent"><button class="pill" role="radio" aria-pressed="false">Filter</button><button class="pill" role="radio" aria-pressed="false">Rank</button><button class="pill" role="radio" aria-pressed="true">Targeted</button></div></section><section class="card"><h2>Target criteria</h2><div class="fields"><div class="field"><label for="sp-dte">DTE range <span class="tag fetch">FETCH</span></label><input id="sp-dte" class="control" aria-label="Spread DTE range" value="30 – 45" readonly><div class="unit">days</div></div><div class="field"><label for="sp-pop">Minimum POP <span class="tag gate">GATE</span></label><input id="sp-pop" class="control" value="70" inputmode="decimal"><div class="unit">%</div></div><div class="field"><label for="sp-otm">Minimum OTM <span class="tag gate">GATE</span></label><input id="sp-otm" class="control" value="8" inputmode="decimal"><div class="unit">%</div></div></div><div class="rowlabel">Quick select</div><div class="pills" aria-label="Spread DTE POP and OTM quick selections"><button class="pill" aria-pressed="false">21–29</button><button class="pill" aria-pressed="true">30–45</button><button class="pill" aria-pressed="false">46–60</button><button class="pill" aria-pressed="false">POP 65%</button><button class="pill" aria-pressed="true">70%</button><button class="pill" aria-pressed="false">75%</button><button class="pill" aria-pressed="false">OTM 4%</button><button class="pill" aria-pressed="true">8%</button><button class="pill" aria-pressed="false">12%</button></div></section><section class="card"><h2>Spread economics & liquidity</h2><div class="fields"><div class="field"><label for="sp-credit">Minimum credit (% of spread width) <span class="tag gate">GATE</span></label><input id="sp-credit" class="control" value="18" inputmode="decimal"><div class="unit">% of spread width</div></div><div class="field"><label for="sp-ivr">Minimum IVR <span class="tag gate">GATE</span></label><input id="sp-ivr" class="control" value="Any" readonly><div class="unit">off</div></div><div class="field"><label for="sp-oi">Minimum relevant-leg OI <span class="tag gate">GATE</span></label><input id="sp-oi" class="control" value="500" inputmode="numeric"><div class="unit">contracts</div></div></div><div class="rowlabel">Quick select</div><div class="pills" aria-label="Spread economics quick selections"><button class="pill off" aria-pressed="false">Credit Any</button><button class="pill" aria-pressed="false">15%</button><button class="pill" aria-pressed="false">20%</button><button class="pill" aria-pressed="true">Custom</button><button class="pill" aria-pressed="true">IVR Any</button><button class="pill" aria-pressed="false">20%</button><button class="pill" aria-pressed="false">OI 100</button><button class="pill" aria-pressed="false">200</button><button class="pill" aria-pressed="false">300</button><button class="pill" aria-pressed="true">500</button></div><p class="manual"><b>Manual override shown:</b> credit is typed as 18%, so `Custom` is selected and no preset credit pill is active.</p></section><section class="card"><h2>Always applied</h2><div class="check"><b>✓</b>Earnings before expiration disqualifies a candidate.</div><div class="check"><b>✓</b>Quote quality policy is enforced before a candidate is shown.</div></section></div><aside class="card summary"><h2>Scan summary</h2><dl><dt>Fetch</dt><dd>30–45 DTE</dd><dt>Target gates</dt><dd>POP ≥ 70% · OTM ≥ 8% · credit ≥ 18% of width</dd><dt>Custom state</dt><dd>Credit threshold is manually set</dd></dl><button class="run">RUN TARGETED SPREAD SCAN →</button><button class="secondary">Reset profile</button></aside></div></div></template>
<template id="csp"><div class="frame"><header class="head"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>CASH-SECURED PUT · TARGETED SCAN</h1><p class="sub">CSP return, liquidity preferences, and optional account-affordability context.</p></div><div class="scope"><b>44 selected tickers</b><span>Connected account disclosed before run</span></div></header><div class="layout"><div class="body"><section class="card"><h2>Search intent</h2><div class="pills" role="radiogroup" aria-label="CSP search intent"><button class="pill" role="radio" aria-pressed="false">Filter</button><button class="pill" role="radio" aria-pressed="false">Rank</button><button class="pill" role="radio" aria-pressed="true">Targeted</button></div></section><section class="card"><h2>Candidate search & targeted gates</h2><div class="fields"><div class="field"><label for="csp-dte">DTE range <span class="tag fetch">SEARCH RANGE</span></label><input id="csp-dte" class="control" value="30 – 45" readonly><div class="unit">days</div></div><div class="field"><label for="csp-delta">Short-put delta range <span class="tag pref">PREFERENCE</span></label><input id="csp-delta" class="control" value="0.15 – 0.25" readonly></div><div class="field"><label for="csp-target">Targeted POP / OTM <span class="tag gate">GATES</span></label><input id="csp-target" class="control" value="70% / 8%" readonly></div></div><div class="rowlabel">Quick select</div><div class="pills" aria-label="CSP search quick selections"><button class="pill" aria-pressed="true">30–45 DTE</button><button class="pill" aria-pressed="false">21–60</button><button class="pill" aria-pressed="false">Δ .12–.20</button><button class="pill" aria-pressed="true">Δ .15–.25</button><button class="pill" aria-pressed="false">Δ .20–.30</button><button class="pill" aria-pressed="true">POP 70%</button><button class="pill" aria-pressed="true">OTM 8%</button></div></section><section class="card"><h2>Return, liquidity & capital</h2><div class="fields"><div class="field"><label for="csp-roc">Minimum period ROC <span class="tag gate">TARGET GATE</span></label><input id="csp-roc" class="control" value="1.5" inputmode="decimal"><div class="unit">% over option period</div></div><div class="field"><label for="csp-oi">OI preference <span class="tag pref">PREFERENCE</span></label><input id="csp-oi" class="control" value="500" inputmode="numeric"><div class="unit">contracts; lower OI is retained with a warning</div></div><div class="field"><label for="csp-width">Bid/ask preference <span class="tag pref">PREFERENCE</span></label><input id="csp-width" class="control" value="$0.10" inputmode="decimal"><div class="unit">per share; independent quality policy still applies</div></div></div><div class="rowlabel">Quick select</div><div class="pills" aria-label="CSP return and liquidity quick selections"><button class="pill off" aria-pressed="false">ROC Any</button><button class="pill" aria-pressed="false">0.8%</button><button class="pill" aria-pressed="true">1.5%</button><button class="pill" aria-pressed="false">OI 100</button><button class="pill" aria-pressed="false">200</button><button class="pill" aria-pressed="false">300</button><button class="pill" aria-pressed="true">500</button><button class="pill" aria-pressed="false">Width $0.05</button><button class="pill" aria-pressed="true">$0.10</button></div><div class="notice"><b>Capital account:</b> Broker cash is disclosed. <b>Affordable-only is optional</b>; when off, candidates are retained and their collateral requirement is shown.</div></section></div><aside class="card summary"><h2>Scan summary</h2><dl><dt>Search range</dt><dd>30–45 DTE · delta preference .15–.25</dd><dt>Target gates</dt><dd>POP ≥ 70% · OTM ≥ 8% · ROC ≥ 1.5%</dd><dt>Preferences</dt><dd>OI 500 · bid/ask $0.10</dd><dt>Capital</dt><dd>Affordable-only off</dd></dl><button class="run">RUN CSP SCAN →</button><button class="secondary">Reset profile</button></aside></div></div></template>
<template id="cc"><div class="frame"><header class="head"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>COVERED CALL SCAN</h1><p class="sub">Short calls against broker-verified share lots.</p></div><div class="scope"><b>12 eligible share lots</b><span>Across 8 held symbols</span></div></header><div class="layout"><div class="body"><section class="card"><h2>Short-call search</h2><div class="fields"><div class="field"><label for="cc-dte">DTE range <span class="tag fetch">FETCH</span></label><input id="cc-dte" class="control" value="21 – 45" readonly><div class="unit">days</div></div><div class="field"><label for="cc-delta">Call delta range <span class="tag gate">GATE</span></label><input id="cc-delta" class="control" value="0.20 – 0.35" readonly></div><div class="field"><label for="cc-oi">OI preference <span class="tag pref">PREFERENCE</span></label><input id="cc-oi" class="control" value="100" inputmode="numeric"><div class="unit">contracts; candidates below it are retained with a warning</div></div></div><div class="rowlabel">Quick select</div><div class="pills" aria-label="Covered call quick selections"><button class="pill" aria-pressed="false">14–21</button><button class="pill" aria-pressed="true">21–45</button><button class="pill" aria-pressed="false">30–45</button><button class="pill" aria-pressed="false">Δ .15–.25</button><button class="pill" aria-pressed="true">Δ .20–.35</button><button class="pill" aria-pressed="false">OI 100</button><button class="pill" aria-pressed="true">Custom</button><button class="pill" aria-pressed="false">200</button><button class="pill" aria-pressed="false">300</button><button class="pill" aria-pressed="false">500</button></div><p class="manual"><b>Custom shown:</b> the OI preference is manually set to 100 only if no 100 pill is active; use exactly one selected pill per category in implementation.</p></section><section class="card"><h2>Position guardrail</h2><div class="fields"><div class="field"><label for="cc-basis">Strike eligibility <span class="tag guard">CONDITIONAL</span></label><input id="cc-basis" class="control" value="Above current price; above cost basis when basis is verified" readonly><div class="unit">Cost-basis guard is not applied when verified basis is unavailable.</div></div><div class="field"><label for="cc-width">Maximum bid/ask width <span class="tag gate">GATE</span></label><input id="cc-width" class="control" value="$0.20" inputmode="decimal"><div class="unit">per share</div></div></div><div class="rowlabel">Quick select</div><div class="pills"><button class="pill" aria-pressed="false">$0.10</button><button class="pill" aria-pressed="true">$0.20</button><button class="pill" aria-pressed="false">$0.30</button><button class="pill" aria-pressed="false">Custom</button></div></section></div><aside class="card summary"><h2>Scan summary</h2><dl><dt>Eligible source</dt><dd>12 verified lots</dd><dt>Fetch</dt><dd>21–45 DTE</dd><dt>Guard</dt><dd>Current price; verified cost basis if available</dd><dt>Preference</dt><dd>OI 100</dd></dl><button class="run">RUN COVERED CALL SCAN →</button><button class="secondary">Reset defaults</button></aside></div></div></template>
<template id="pmcc"><div class="frame"><header class="head"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>PMCC · SHORT-CALL SEARCH</h1><p class="sub">Held long calls are broker-backed context; only the short income leg is configured.</p></div><div class="scope"><b>6 eligible held long calls</b><span>Foundation health is read only</span></div></header><div class="layout"><div class="body"><section class="card"><h2>Held long-call context <span class="tag guard">READ ONLY</span></h2><p class="hint">Per-position DTE, delta, coverage and quote health are disclosed; no long-leg presets are offered.</p></section><section class="card"><h2>Short-call search</h2><div class="fields"><div class="field"><label for="pm-dte">Short-call DTE range <span class="tag fetch">FETCH</span></label><input id="pm-dte" class="control" value="7 – 45" readonly><div class="unit">days</div></div><div class="field"><label for="pm-delta">Short-call delta <span class="tag pref">RANK / GUARDRAIL</span></label><input id="pm-delta" class="control" value="0.20 – 0.35" readonly><div class="unit">does not hide an otherwise tradable call</div></div><div class="field"><label for="pm-oi">Short OI preference <span class="tag pref">PREFERENCE</span></label><input id="pm-oi" class="control" value="100" inputmode="numeric"><div class="unit">contracts</div></div></div><div class="rowlabel">Quick select</div><div class="pills" aria-label="PMCC short call quick selections"><button class="pill" aria-pressed="true">7–45</button><button class="pill" aria-pressed="false">14–21</button><button class="pill" aria-pressed="false">21–45</button><button class="pill" aria-pressed="false">Δ .15–.25</button><button class="pill" aria-pressed="true">Δ .20–.35</button><button class="pill" aria-pressed="true">OI 100</button><button class="pill" aria-pressed="false">200</button><button class="pill" aria-pressed="false">300</button><button class="pill" aria-pressed="false">500</button></div></section></div><aside class="card summary"><h2>Scan summary</h2><dl><dt>Foundation</dt><dd>6 held long calls, read only</dd><dt>Fetch</dt><dd>Short calls, 7–45 DTE</dd><dt>Rank / guardrail</dt><dd>Delta .20–.35</dd><dt>Preference</dt><dd>Short OI 100</dd></dl><button class="run">RUN PMCC SCAN →</button><button class="secondary">Reset short-call defaults</button></aside></div></div></template>
<template id="leaps"><div class="frame"><header class="head"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>LEAPS SCAN</h1><p class="sub">DTE is the fetch boundary; available result data can then be filtered without a new fetch.</p></div><div class="scope"><b>44 selected tickers</b><span>Standalone LEAPS engine behavior remains limited</span></div></header><div class="layout"><div class="body"><section class="card"><h2>Fetch boundary</h2><div class="fields"><div class="field"><label for="lp-dte">DTE range <span class="tag fetch">FETCH / RESCAN</span></label><input id="lp-dte" class="control" value="180 – 730" readonly><div class="unit">days</div></div></div><div class="rowlabel">Quick select</div><div class="pills"><button class="pill" aria-pressed="false">90–180</button><button class="pill" aria-pressed="false">180–365</button><button class="pill" aria-pressed="false">365–730</button><button class="pill" aria-pressed="true">180–730</button><button class="pill" aria-pressed="false">Custom</button></div></section><section class="card"><h2>Results filters</h2><div class="fields"><div class="field"><label for="lp-delta">Delta range <span class="tag gate">RESULT FILTER</span></label><input id="lp-delta" class="control" value="0.70 – 0.85" readonly><div class="unit">Candidates with missing delta are retained and flagged “Delta unavailable”.</div></div><div class="field"><label for="lp-oi">Minimum OI <span class="tag gate">RESULT FILTER</span></label><input id="lp-oi" class="control" value="100" inputmode="numeric"><div class="unit">contracts; missing OI is retained and flagged “OI unavailable”.</div></div><div class="field"><label for="lp-ext">Maximum extrinsic value (% of what?) <span class="tag guard">DECISION NEEDED</span></label><input id="lp-ext" class="control" value="Unavailable until denominator is defined" disabled><div class="unit">Current standalone engine does not establish a verified percentage denominator; no formula is invented here.</div></div></div><div class="rowlabel">Quick select</div><div class="pills" aria-label="LEAPS results filters"><button class="pill" aria-pressed="true">Δ .70–.85</button><button class="pill" aria-pressed="false">Δ .80–.90</button><button class="pill" aria-pressed="true">OI 100</button><button class="pill" aria-pressed="false">200</button><button class="pill" aria-pressed="false">300</button><button class="pill" aria-pressed="false">500</button><button class="pill off" aria-pressed="true">Extrinsic unavailable</button></div><div class="notice"><b>Decision needed:</b> define and implement one extrinsic percentage denominator before enabling this control. Until then it is visibly unavailable and does not filter results.</div></section></div><aside class="card summary"><h2>Scan summary</h2><dl><dt>Fetch</dt><dd>180–730 DTE</dd><dt>Result filters</dt><dd>Delta .70–.85 · OI ≥ 100 when present</dd><dt>Missing data</dt><dd>Retained and flagged, never silently dropped</dd><dt>Extrinsic percentage</dt><dd>Not applied — denominator decision needed</dd></dl><button class="run">RUN LEAPS SCAN →</button><button class="secondary">Reset defaults</button></aside></div></div></template>
<template id="zero"><div class="frame unavailable"><header class="head"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>COVERED CALL SCAN</h1><p class="sub">This holdings-based scan needs verified share coverage.</p></div><div class="scope"><b>0 eligible share lots</b><span>Connected account checked</span></div></header><div class="layout"><div class="body"><section class="card"><h2>No eligible covered-call holdings</h2><p class="hint">No holding has at least 100 uncovered shares available to cover a call.</p><div class="notice"><b>Recovery:</b> Refresh broker data, choose another account, or use a universe-based strategy. No editable filters are shown because this scan cannot run.</div></section></div><aside class="card summary"><h2>Scan unavailable</h2><dl><dt>Eligibility</dt><dd>0 verified covered lots</dd><dt>Next step</dt><dd>Refresh broker data or choose another account</dd></dl><button class="run disabled" disabled>RUN COVERED CALL SCAN</button><button class="secondary">Refresh eligibility</button></aside></div></div></template>
<script>const host=document.querySelector('#host'),tabs=[...document.querySelectorAll('.tabs button')];function press(group,chosen){group.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===chosen)))}function qualify(id,text){const input=host.querySelector(id);if(!input)return;const tag=input.labels[0].querySelector('.tag');tag.className='tag gate';tag.textContent=text}function wire(){const ccOi=host.querySelector('#cc-oi');if(ccOi){const row=ccOi.closest('.card').querySelector('.pills');row.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.textContent==='OI 100')))}qualify('#csp-delta','QUALIFICATION GATE');qualify('#pm-oi','QUALIFICATION GATE');const cspSummary=host.querySelector('#csp-delta')&&host.querySelector('.summary dl');if(cspSummary)cspSummary.innerHTML='<dt>Search range</dt><dd>30–45 DTE</dd><dt>Qualification gates</dt><dd>Delta .15–.25 · POP ≥ 70% · OTM ≥ 8% · ROC ≥ 1.5%</dd><dt>Preferences</dt><dd>OI 500 · bid/ask $0.10</dd><dt>Capital</dt><dd>Affordable-only off</dd>';const pmSummary=host.querySelector('#pm-oi')&&host.querySelector('.summary dl');if(pmSummary)pmSummary.innerHTML='<dt>Foundation</dt><dd>6 held long calls, read only</dd><dt>Fetch</dt><dd>Short calls, 7–45 DTE</dd><dt>Must qualify</dt><dd>Short OI ≥ 100</dd><dt>Rank / guardrail</dt><dd>Delta .20–.35</dd>';host.querySelectorAll('.pills').forEach(group=>group.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>press(group,btn))))}function show(v){host.replaceChildren(document.querySelector('#'+v).content.cloneNode(true));wire();tabs.forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.v===v)))}tabs.forEach(t=>t.addEventListener('click',()=>show(t.dataset.v)));show('spreads')</script></body></html>
