<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unified Screener configuration · Revision 2</title><style>
:root{--bg:#090a0b;--surface:#171819;--surface2:#101112;--line:#393c3e;--text:#f4f5f5;--muted:#a0a5a9;--faint:#73787c;--teal:#51e5d3;--amber:#ffc436;--blue:#9cc8ff;--purple:#d0b3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}.wrap{max-width:1160px;margin:28px auto;padding:0 16px}.tabs,.pills{display:flex;gap:7px;flex-wrap:wrap}.tabs{margin-bottom:16px}.tabs button,.pill{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);font:700 12px inherit;padding:7px 10px;cursor:pointer}.tabs button[aria-pressed=true],.pill.on{border-color:var(--teal);background:#123d39;color:var(--teal)}.pill.off{border-style:dashed}.frame{background:#101112;border:1px solid #282a2b;border-radius:20px;padding:28px;min-height:780px}.head{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:20px}.eyebrow{color:var(--teal);font-size:11px;letter-spacing:.12em;font-weight:900}.head h1{font-size:24px;letter-spacing:.05em;margin:4px 0}.sub{margin:0;color:var(--muted)}.scope{border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:245px}.scope b{display:block}.scope span{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin-top:20px}.body{display:grid;gap:13px}.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px}.card h2{font-size:12px;letter-spacing:.1em;margin:0 0 3px;text-transform:uppercase}.hint,.manual{font-size:12px;color:var(--muted);margin:0 0 12px}.manual{color:var(--faint);margin:10px 0 0}.manual b{color:var(--muted)}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.value{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;font-weight:800;min-height:40px}.unit{font-size:11px;color:var(--faint);margin-top:4px}.rowlabel{font-size:10px;color:var(--faint);font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:13px 0 6px}.tag{font-size:9px;border-radius:12px;padding:2px 6px;margin-left:5px;font-weight:900;letter-spacing:.04em}.fetch{background:#1d2d3b;color:var(--blue)}.filter{background:#163b37;color:var(--teal)}.rank{background:#322640;color:var(--purple)}.guard{background:#3b3115;color:#ffe28d}.checks div{border-top:1px solid var(--line);padding:8px 0;font-size:12px}.checks div:first-child{border-top:0}.checks b{color:var(--teal);margin-right:7px}.summary{height:max-content;position:sticky;top:14px;background:#131d1c;border-color:#27635b}.summary dl{margin:13px 0}.summary dt{font-size:10px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}.summary dd{margin:2px 0 10px;font-weight:800}.run,.secondary{width:100%;border-radius:9px;padding:12px;font-weight:900;font-size:13px}.run{border:0;background:var(--amber);color:#191303}.secondary{margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--muted)}.notice{border-left:3px solid var(--amber);background:#382d14;color:#ffe39d;padding:10px 12px;border-radius:5px;font-size:12px}.read{background:#111c1b;border-color:#28645b}.unavailable .run{background:#55514a;color:#bbb5aa}.unavailable .card{border-color:#715a1b}.legend{font-size:10px;color:var(--faint);line-height:1.7}.legend span{margin-right:8px}@media(max-width:760px){.head,.layout{display:block}.scope{margin-top:14px}.summary{position:static;margin-top:14px}.fields{grid-template-columns:1fr 1fr}}@media(max-width:480px){.frame{padding:18px}.fields{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><nav class="tabs" aria-label="Mockup screens"><button data-v="spreads" aria-pressed="true">Targeted Spreads</button><button data-v="csp" aria-pressed="false">Cash-Secured Put</button><button data-v="cc" aria-pressed="false">Covered Call</button><button data-v="pmcc" aria-pressed="false">PMCC</button><button data-v="leaps" aria-pressed="false">LEAPS</button><button data-v="zero" aria-pressed="false">Zero eligible</button></nav><div id="host"></div></main>
<template id="spreads"><div class="frame"><header class="head"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>SPREADS · TARGETED SCAN</h1><p class="sub">A narrowed defined-risk spread search.</p></div><div class="scope"><b>44 selected tickers</b><span>Opportunity Universe · broker fetch required</span></div></header><div class="layout"><div class="body"><section class="card"><h2>Search intent</h2><p class="hint">Targeted is selected; Filter and Rank are separate search outcomes.</p><div class="pills"><button class="pill">Filter</button><button class="pill">Rank</button><button class="pill on">Targeted</button></div></section><section class="card"><h2>Time, probability & distance</h2><div class="fields"><div class="field"><label>DTE range <span class="tag fetch">FETCH</span></label><div class="value">30 – 45</div><div class="unit">days</div></div><div class="field"><label>Minimum POP <span class="tag filter">GATE</span></label><div class="value">70</div><div class="unit">%</div></div><div class="field"><label>Minimum OTM <span class="tag filter">GATE</span></label><div class="value">8</div><div class="unit">%</div></div></div><div class="rowlabel">Quick select</div><div class="pills"><button class="pill">7–13</button><button class="pill">14–20</button><button class="pill">21–29</button><button class="pill on">30–45</button><button class="pill">46–60</button><button class="pill off">POP Any</button><button class="pill on">70%</button><button class="pill">75%</button><button class="pill off">OTM Any</button><button class="pill on">8%</button><button class="pill">12%</button></div><p class="manual"><b>Custom:</b> edit a number or range above. Its category then shows a `Custom` pill instead of a selected preset.</p></section><section class="card"><h2>Spread economics & liquidity</h2><div class="fields"><div class="field"><label>Minimum credit (% of spread width) <span class="tag filter">GATE</span></label><div class="value">20</div><div class="unit">% of spread width</div></div><div class="field"><label>Minimum IVR <span class="tag filter">GATE</span></label><div class="value">Any</div><div class="unit">off</div></div><div class="field"><label>Minimum relevant-leg OI <span class="tag filter">GATE</span></label><div class="value">500</div><div class="unit">contracts</div></div></div><div class="rowlabel">Quick select</div><div class="pills"><button class="pill off">Credit Any</button><button class="pill">15%</button><button class="pill on">20%</button><button class="pill">25%</button><button class="pill">33%</button><button class="pill on">IVR Any</button><button class="pill">20%</button><button class="pill">30%</button><button class="pill">OI 100</button><button class="pill on">500</button><button class="pill">1k</button></div></section><section class="card checks"><h2>Always applied</h2><div><b>✓</b>Earnings before expiration disqualifies a candidate.</div><div><b>✓</b>Quote quality is enforced before a trade is shown.</div></section></div><aside class="card summary"><div class="legend"><span>FETCH = rescan</span><span>GATE = qualify</span><span>RANK = order</span></div><h2>Scan summary</h2><dl><dt>Fetch</dt><dd>30–45 DTE</dd><dt>Must qualify</dt><dd>POP ≥ 70% · OTM ≥ 8% · credit ≥ 20% of width</dd><dt>Result filters later</dt><dd>Credit, POP, OTM, OI</dd></dl><button class="run">RUN TARGETED SPREAD SCAN →</button><button class="secondary">Reset profile</button></aside></div></div></template>
<template id="csp"><div class="frame"><header class="head"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>CASH-SECURED PUT · TARGETED SCAN</h1><p class="sub">A CSP search using its actual return and capital semantics.</p></div><div class="scope"><b>44 selected tickers</b><span>Account disclosure appears below</span></div></header><div class="layout"><div class="body"><section class="card"><h2>Time, probability & distance</h2><div class="fields"><div class="field"><label>DTE range <span class="tag fetch">FETCH</span></label><div class="value">30 – 45</div><div class="unit">days</div></div><div class="field"><label>Short-put delta range <span class="tag filter">GATE</span></label><div class="value">0.15 – 0.25</div></div><div class="field"><label>Targeted POP / OTM <span class="tag filter">GATE</span></label><div class="value">70% / 8%</div></div></div><div class="rowlabel">Quick select</div><div class="pills"><button class="pill on">30–45 DTE</button><button class="pill">21–60</button><button class="pill">Δ .12–.20</button><button class="pill on">Δ .15–.25</button><button class="pill">Δ .20–.30</button><button class="pill">POP 65%</button><button class="pill on">70%</button><button class="pill">OTM 4%</button><button class="pill on">8%</button></div></section><section class="card"><h2>Return, liquidity & capital</h2><div class="fields"><div class="field"><label>Minimum period ROC <span class="tag filter">GATE</span></label><div class="value">1.5</div><div class="unit">% over the option period</div></div><div class="field"><label>OI preference <span class="tag rank">RANK</span></label><div class="value">500</div><div class="unit">contracts; higher is preferred</div></div><div class="field"><label>Bid/ask preference <span class="tag rank">RANK</span></label><div class="value">$0.10</div><div class="unit">per share; quality policy still applies</div></div></div><div class="rowlabel">Quick select</div><div class="pills"><button class="pill off">ROC Any</button><button class="pill">0.8%</button><button class="pill">1.2%</button><button class="pill on">1.5%</button><button class="pill">OI 250</button><button class="pill on">500</button><button class="pill">1k</button><button class="pill">Width $0.05</button><button class="pill on">$0.10</button></div><div class="notice">Capital account: connected broker account is shown here before run. <b>Affordable-only is optional</b>; when off, results disclose required collateral rather than rejecting unaffordable candidates.</div></section><section class="card checks"><h2>Always applied</h2><div><b>✓</b>Earnings before expiration disqualifies a CSP.</div><div><b>✓</b>Liquidity quality policy is applied independently of the preference values.</div></section></div><aside class="card summary"><h2>Scan summary</h2><dl><dt>Fetch</dt><dd>30–45 DTE</dd><dt>Target gates</dt><dd>POP ≥ 70% · OTM ≥ 8% · ROC ≥ 1.5%</dd><dt>Capital mode</dt><dd>Affordable only: off · collateral displayed</dd></dl><button class="run">RUN CSP SCAN →</button><button class="secondary">Reset profile</button></aside></div></div></template>
<template id="cc"><div class="frame"><header class="head"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>COVERED CALL SCAN</h1><p class="sub">Calls are searched only against broker-verified share coverage.</p></div><div class="scope"><b>12 eligible share lots</b><span>Across 8 held symbols</span></div></header><div class="layout"><div class="body"><section class="card"><h2>Short-call search</h2><div class="fields"><div class="field"><label>DTE range <span class="tag fetch">FETCH</span></label><div class="value">21 – 45</div><div class="unit">days</div></div><div class="field"><label>Call delta range <span class="tag filter">GATE</span></label><div class="value">0.20 – 0.35</div></div><div class="field"><label>OI minimum <span class="tag filter">GATE</span></label><div class="value">100</div><div class="unit">contracts</div></div></div><div class="rowlabel">Quick select</div><div class="pills"><button class="pill">14–21</button><button class="pill on">21–45</button><button class="pill">30–45</button><button class="pill">45–60</button><button class="pill">Δ .15–.25</button><button class="pill on">Δ .20–.35</button><button class="pill">Δ .30–.45</button><button class="pill on">OI 100</button><button class="pill">500</button><button class="pill">1k</button></div></section><section class="card"><h2>Position guardrails</h2><div class="fields"><div class="field"><label>Strike eligibility <span class="tag guard">REQUIRED</span></label><div class="value">Above cost basis and current price</div><div class="unit">broker-derived holding data; not a user preset</div></div><div class="field"><label>Maximum bid/ask width <span class="tag filter">GATE</span></label><div class="value">$0.20</div><div class="unit">per share</div></div></div><div class="rowlabel">Quick select</div><div class="pills"><button class="pill">$0.10</button><button class="pill on">$0.20</button><button class="pill">$0.30</button><button class="pill">Custom</button></div></section><section class="card checks"><h2>Always applied</h2><div><b>✓</b>Coverage is verified by lot; no watchlist can create coverage.</div><div><b>✓</b>Earnings before expiration disqualifies the call.</div></section></div><aside class="card summary"><h2>Scan summary</h2><dl><dt>Eligible source</dt><dd>12 covered share lots</dd><dt>Fetch</dt><dd>21–45 DTE</dd><dt>Must qualify</dt><dd>Δ .20–.35 · OI ≥ 100 · width ≤ $0.20</dd><dt>Position guard</dt><dd>Strike clears cost basis and price</dd></dl><button class="run">RUN COVERED CALL SCAN →</button><button class="secondary">Reset defaults</button></aside></div></div></template>
<template id="pmcc"><div class="frame"><header class="head"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>PMCC · SHORT-CALL SEARCH</h1><p class="sub">Held long calls are broker-backed context. This scan configures the short income leg only.</p></div><div class="scope"><b>6 eligible held long calls</b><span>Broker position health checked</span></div></header><div class="layout"><div class="body"><section class="card read"><h2>Held long-call context <span class="tag guard">READ ONLY</span></h2><div class="fields"><div class="field"><label>Eligible foundations</label><div class="value">6 held LEAPS calls</div></div><div class="field"><label>Foundation health</label><div class="value">DTE, delta, coverage and quote status shown per position</div></div><div class="field"><label>Why no long-leg presets?</label><div class="value">The held contract is not being fetched or reconfigured</div></div></div></section><section class="card"><h2>Short-call search</h2><div class="fields"><div class="field"><label>Short-call DTE range <span class="tag fetch">FETCH</span></label><div class="value">7 – 45</div><div class="unit">days</div></div><div class="field"><label>Short-call delta <span class="tag rank">RANK / GUARDRAIL</span></label><div class="value">0.20 – 0.35</div><div class="unit">guides ranking; does not hide an otherwise tradable call</div></div><div class="field"><label>Short OI minimum <span class="tag filter">GATE</span></label><div class="value">100</div><div class="unit">contracts</div></div></div><div class="rowlabel">Quick select</div><div class="pills"><button class="pill on">7–45</button><button class="pill">14–21</button><button class="pill">21–45</button><button class="pill">30–45</button><button class="pill">Δ .15–.25</button><button class="pill on">Δ .20–.35</button><button class="pill">Δ .30–.45</button><button class="pill on">OI 100</button><button class="pill">500</button></div><p class="manual"><b>Custom:</b> a typed delta remains a ranking/guardrail value; it must not become a hidden qualification gate.</p></section><section class="card checks"><h2>Always applied</h2><div><b>✓</b>Broker-held long calls must remain eligible foundations.</div><div><b>✓</b>Short-call quote quality and structural compatibility are checked by the pairing policy.</div></section></div><aside class="card summary"><h2>Scan summary</h2><dl><dt>Foundation</dt><dd>6 held long calls (read only)</dd><dt>Fetch</dt><dd>Short calls, 7–45 DTE</dd><dt>Short-leg gate</dt><dd>OI ≥ 100</dd><dt>Ranking guardrail</dt><dd>Delta .20–.35</dd></dl><button class="run">RUN PMCC SCAN →</button><button class="secondary">Reset short-call defaults</button></aside></div></div></template>
<template id="leaps"><div class="frame"><header class="head"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>LEAPS SCAN</h1><p class="sub">DTE determines the broker fetch. Delta, OI, and extrinsic refine completed results.</p></div><div class="scope"><b>44 selected tickers</b><span>Opportunity Universe · broker fetch required</span></div></header><div class="layout"><div class="body"><section class="card"><h2>Fetch boundary</h2><div class="fields"><div class="field"><label>DTE range <span class="tag fetch">FETCH / RESCAN</span></label><div class="value">180 – 730</div><div class="unit">days</div></div></div><div class="rowlabel">Quick select</div><div class="pills"><button class="pill">90–180</button><button class="pill">180–365</button><button class="pill">365–730</button><button class="pill on">180–730</button><button class="pill">Custom</button></div></section><section class="card"><h2>Results filters</h2><p class="hint">These change the result set without another broker fetch.</p><div class="fields"><div class="field"><label>Delta range <span class="tag filter">RESULT FILTER</span></label><div class="value">0.70 – 0.85</div></div><div class="field"><label>Minimum OI <span class="tag filter">RESULT FILTER</span></label><div class="value">100</div><div class="unit">contracts</div></div><div class="field"><label>Maximum extrinsic value <span class="tag filter">RESULT FILTER</span></label><div class="value">No cap</div><div class="unit">off</div></div></div><div class="rowlabel">Quick select</div><div class="pills"><button class="pill">Δ .60–.75</button><button class="pill on">Δ .70–.85</button><button class="pill">Δ .80–.90</button><button class="pill on">OI 100</button><button class="pill">500</button><button class="pill">1k</button><button class="pill on">No cap</button><button class="pill">20%</button><button class="pill">30%</button><button class="pill">Custom</button></div><p class="manual"><b>Custom:</b> exact manual values replace the selected pill within that filter category.</p></section><section class="card checks"><h2>Always applied</h2><div><b>✓</b>Contracts must have valid option data; results disclose intrinsic and extrinsic value.</div></section></div><aside class="card summary"><h2>Scan summary</h2><dl><dt>Fetch</dt><dd>180–730 DTE</dd><dt>Result filters</dt><dd>Δ .70–.85 · OI ≥ 100 · extrinsic cap off</dd><dt>Rescan needed?</dt><dd>Only when DTE changes</dd></dl><button class="run">RUN LEAPS SCAN →</button><button class="secondary">Reset defaults</button></aside></div></div></template>
<template id="zero"><div class="frame unavailable"><header class="head"><div><div class="eyebrow">SCREENER / CONFIGURE</div><h1>COVERED CALL SCAN</h1><p class="sub">This holdings-based scan cannot start until broker-verified share coverage exists.</p></div><div class="scope"><b>0 eligible share lots</b><span>Connected account checked</span></div></header><div class="layout"><div class="body"><section class="card"><h2>No eligible covered-call holdings</h2><p class="hint">No position contains at least 100 uncovered shares available to cover a call.</p><div class="notice"><b>Recovery:</b> refresh the broker connection, select another account, or use a universe-based Screener strategy. There are no editable scan settings while eligibility is zero.</div></section></div><aside class="card summary"><h2>Scan unavailable</h2><dl><dt>Eligibility</dt><dd>0 verified covered lots</dd><dt>Next step</dt><dd>Refresh broker data or select another account</dd></dl><button class="run" disabled>RUN COVERED CALL SCAN</button><button class="secondary">Refresh eligibility</button></aside></div></div></template>
<script>const h=document.querySelector('#host'),b=[...document.querySelectorAll('.tabs button')];function show(v){h.replaceChildren(document.querySelector('#'+v).content.cloneNode(true));b.forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v))}b.forEach(x=>x.onclick=()=>show(x.dataset.v));show('spreads')</script></body></html>
