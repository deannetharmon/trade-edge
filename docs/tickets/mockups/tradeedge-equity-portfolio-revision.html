        const safeName = ['management','risk','full','custom'].includes(name) ? name : 'full';
        const shown = safeName === 'custom' ? preferences.customColumns : presetColumns[safeName];
        preferences.analysisView = safeName;
        applyColumns(Array.isArray(shown) && shown.length ? shown : presetColumns.full, safeName);
        savePreferences();
      };
      viewSelect?.addEventListener('change', () => applyView(viewSelect.value));
      const columnDialog = root.querySelector('#columns-dialog');
      const syncColumnDialog = () => {
        const shown = preferences.analysisView === 'custom' ? preferences.customColumns : presetColumns[preferences.analysisView] || presetColumns.full;
        columnDialog?.querySelectorAll('[data-column-number]').forEach(input => { input.checked = shown.includes(Number(input.dataset.columnNumber)); });
      };
      root.querySelector('[data-reset-columns]')?.addEventListener('click', () => {
        const base = preferences.analysisView === 'custom' ? presetColumns.full : presetColumns[preferences.analysisView];
        columnDialog?.querySelectorAll('[data-column-number]').forEach(input => { input.checked = base.includes(Number(input.dataset.columnNumber)); });
      });
      root.querySelector('[data-apply-columns]')?.addEventListener('click', event => {
        const selected = [...columnDialog.querySelectorAll('[data-column-number]:checked')].map(input => Number(input.dataset.columnNumber));
        if (!selected.includes(1)) selected.unshift(1);
        preferences.customColumns = selected;
        preferences.analysisView = 'custom';
        applyColumns(selected, 'custom');
        savePreferences();
      });
      const filterDialog = root.querySelector('#filter-dialog');
      const filterMap = { ORCL:{strategy:'short-premium',attention:'false',pnl:'profit'}, BE:{strategy:'short-premium',attention:'true',pnl:'profit'}, MRNA:{strategy:'long-option',attention:'true',pnl:'loss'}, AAPL:{strategy:'pmcc',attention:'false',pnl:'loss'} };
      const syncFilterDialog = () => filterDialog?.querySelectorAll('input[type="checkbox"]').forEach(input => { input.checked = (preferences.filters[input.name] || []).includes(input.value); });
      const applyFilters = () => {
        let visible = 0;
        root.querySelectorAll('[data-analysis-symbol]').forEach(row => {
          const symbol = row.dataset.analysisSymbol;
          const meta = filterMap[symbol];
          const matches = ['symbol','strategy','attention','pnl'].every(key => !preferences.filters[key].length || preferences.filters[key].includes(key === 'symbol' ? symbol : meta[key]));
          row.hidden = !matches;
          if (matches) visible += 1;
        });
        const count = Object.values(preferences.filters).reduce((total, values) => total + values.length, 0);
        const badge = root.querySelector('[data-filter-count]');
        if (badge) { badge.textContent = count; badge.hidden = count === 0; }
        const summary = root.querySelector('[data-result-summary]');
        if (summary) summary.textContent = count ? `Showing ${visible} of 4 open contracts · ${count} active ${count === 1 ? 'filter' : 'filters'}` : 'Showing all 4 open contracts';
      };
      root.querySelector('[data-clear-filters]')?.addEventListener('click', () => filterDialog?.querySelectorAll('input[type="checkbox"]').forEach(input => { input.checked = false; }));
      root.querySelector('[data-apply-filters]')?.addEventListener('click', () => {
        const next = { symbol:[], strategy:[], attention:[], pnl:[] };
        filterDialog.querySelectorAll('input[type="checkbox"]:checked').forEach(input => next[input.name].push(input.value));
        preferences.filters = next;
        applyFilters();
        savePreferences();
      });
      root.querySelectorAll('[data-open-dialog]').forEach(button => button.addEventListener('click', () => {
        const dialog = root.querySelector(`#${button.dataset.openDialog}`);
        if (dialog === columnDialog) syncColumnDialog();
        if (dialog === filterDialog) syncFilterDialog();
        dialog?.showModal();
      }));
      applyView(preferences.analysisView);
      applyFilters();
      setWorkspaceView(preferences.workspace);
      root.querySelectorAll('.view-tab').forEach(tab => tab.addEventListener('click', () => {
        root.querySelectorAll('.view-tab').forEach(candidate => {
          const active = candidate === tab;
          candidate.classList.toggle('active', active);
          candidate.setAttribute('aria-pressed', String(active));
        });
      }));
      root.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !root.classList.contains('detail-closed')) {
          root.querySelector('.drawer-close')?.click();
        }
      }, { once:true });
    };
    const render = (name) => {
      const template = root.querySelector(`#te-equity-${name}`);
      if (!(template instanceof HTMLTemplateElement)) return;
      host.replaceChildren(template.content.cloneNode(true));
      if (name === 'assignment') {
        const replacementAction = [...host.querySelectorAll('button')].find(button => button.textContent.trim() === 'Find next call');
        if (replacementAction) replacementAction.textContent = 'Find Replacement';
      }
      controls.forEach(control => control.setAttribute('aria-pressed', String(control.dataset.view === name)));
      root.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => render(button.dataset.go)));
      if (name === 'mixed') wireOverview();
    };
    controls.forEach(control => control.addEventListener('click', () => render(control.dataset.view)));
    render('mixed');
  })();
</script></body></html>
