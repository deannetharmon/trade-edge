<style>
  #te-integrated-flow {
    --te-page: light-dark(#f5f5f5, #0a0a0a);
    --te-header: light-dark(#111111, #0f0f0f);
    --te-side: light-dark(#ffffff, #0f0f0f);
    --te-surface: light-dark(#ffffff, #171717);
    --te-surface-2: light-dark(#f0f0f0, #222222);
    --te-text: light-dark(#111111, #ffffff);
    --te-muted: light-dark(#555f6d, #b8b8b8);
    --te-faint: light-dark(#6b7280, #808080);
    --te-border: light-dark(#e0e0e0, #2c2c2c);
    --te-accent: #00d4aa;
    --te-blue: light-dark(#2457d6, #6f96ff);
    --te-red: light-dark(#b53c49, #ff6675);
    --te-amber: light-dark(#9c6500, #f5b84b);
    color: var(--te-text);
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
  }
  #te-integrated-flow * { box-sizing: border-box; }
  #te-integrated-flow button, #te-integrated-flow input { font: inherit; }
  #te-integrated-flow .review-strip { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:10px; }
  #te-integrated-flow .review-strip button {
    border:1px solid var(--te-border); background:var(--te-surface); color:var(--te-muted);
    padding:7px 10px; border-radius:8px; cursor:pointer;
  }
  #te-integrated-flow .review-strip button[aria-pressed="true"] { background:var(--te-text); color:var(--te-page); }
  #te-integrated-flow .app { background:var(--te-page); border:1px solid var(--te-border); border-radius:12px; overflow:hidden; }
  #te-integrated-flow .top { background:var(--te-header); color:#fff; padding:10px 16px 0; }
  #te-integrated-flow .brand-row { display:flex; justify-content:space-between; align-items:center; padding-bottom:8px; }
  #te-integrated-flow .brand { display:flex; gap:9px; align-items:center; font-family:"Inter", ui-monospace, monospace; letter-spacing:.12em; font-weight:500; }
  #te-integrated-flow .brand-mark { width:31px; height:31px; display:grid; place-items:center; border:1px solid rgba(0,212,170,.7); border-radius:50%; color:var(--te-accent); }
  #te-integrated-flow .brand em { color:var(--te-accent); font-style:normal; }
  #te-integrated-flow .mode { color:#a7a7a7; }
  #te-integrated-flow .topnav { display:flex; gap:0; overflow-x:auto; border-top:1px solid rgba(255,255,255,.1); }
  #te-integrated-flow .topnav span { padding:8px 11px; color:#9f9f9f; white-space:nowrap; letter-spacing:.08em; }
  #te-integrated-flow .topnav .active { color:var(--te-accent); border-bottom:2px solid var(--te-accent); }
  #te-integrated-flow .work { display:grid; grid-template-columns:250px minmax(0,1fr); min-height:560px; }
  #te-integrated-flow .side { background:var(--te-side); border-right:1px solid var(--te-border); padding:13px; }
  #te-integrated-flow .main { min-width:0; padding:18px; }
  #te-integrated-flow .panel { background:var(--te-surface); border:1px solid var(--te-border); border-radius:11px; padding:14px; }
  #te-integrated-flow .panel + .panel { margin-top:12px; }
  #te-integrated-flow .label { color:var(--te-muted); letter-spacing:.1em; margin-bottom:8px; }
  #te-integrated-flow .tickerbox { color:var(--te-text); background:var(--te-page); border:1px solid var(--te-border); border-radius:7px; padding:9px; width:100%; }
  #te-integrated-flow .launchers { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:10px; }
  #te-integrated-flow .launch, #te-integrated-flow .action {
    border:1px solid var(--te-border); background:transparent; color:var(--te-text); border-radius:7px; padding:8px 10px; cursor:pointer;
  }
  #te-integrated-flow .launch.selected, #te-integrated-flow .action.primary { background:var(--te-accent); border-color:var(--te-accent); color:#061613; font-weight:500; }
  #te-integrated-flow .launch.wide { grid-column:1/-1; }
  #te-integrated-flow .small { color:var(--te-faint); }
  #te-integrated-flow h2, #te-integrated-flow h3, #te-integrated-flow p { margin-top:0; }
  #te-integrated-flow h2 { margin-bottom:5px; font-size:1.25rem; }
  #te-integrated-flow h3 { margin-bottom:7px; font-size:1rem; }
  #te-integrated-flow .sub { color:var(--te-muted); margin-bottom:15px; }
  #te-integrated-flow .identity { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px; }
  #te-integrated-flow .pill { display:inline-block; background:var(--te-surface-2); color:var(--te-muted); border-radius:999px; padding:4px 8px; }
  #te-integrated-flow .score { color:var(--te-accent); font-size:1.35rem; font-weight:500; }
  #te-integrated-flow .facts { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  #te-integrated-flow .fact { padding:10px; border-top:1px solid var(--te-border); }
  #te-integrated-flow .fact span { display:block; color:var(--te-faint); margin-bottom:3px; }
  #te-integrated-flow .callout { margin-top:12px; border-left:3px solid var(--te-accent); background:var(--te-surface-2); padding:11px; }
  #te-integrated-flow .warning { border-left-color:var(--te-amber); }
  #te-integrated-flow .danger { border-left-color:var(--te-red); }
  #te-integrated-flow .actions { display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; margin-top:14px; }
  #te-integrated-flow .action { background:var(--te-surface); }
  #te-integrated-flow .position { display:grid; grid-template-columns:1.2fr .85fr .7fr auto; gap:12px; align-items:center; padding:12px 0; border-top:1px solid var(--te-border); }
  #te-integrated-flow .position:first-of-type { border-top:0; }
  #te-integrated-flow .positive { color:var(--te-accent); }
  #te-integrated-flow .negative { color:var(--te-red); }
  #te-integrated-flow .modal-layer { position:relative; min-height:520px; }
  #te-integrated-flow .dimmed { opacity:.24; pointer-events:none; }
  #te-integrated-flow .dialog { position:absolute; z-index:2; top:24px; left:50%; transform:translateX(-50%); width:min(560px,calc(100% - 24px)); background:var(--te-surface); border:1px solid var(--te-border); border-radius:13px; box-shadow:0 20px 60px rgba(0,0,0,.45); padding:17px; }
  #te-integrated-flow .choice { display:grid; grid-template-columns:auto 1fr auto; gap:10px; padding:12px 0; border-top:1px solid var(--te-border); align-items:start; }
  #te-integrated-flow .choice:first-of-type { border-top:0; }
  #te-integrated-flow .columns { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  #te-integrated-flow .metric-row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--te-border); }
  #te-integrated-flow .metric-row:first-of-type { border-top:0; }
  #te-integrated-flow .history { border-left:2px solid var(--te-border); margin-left:6px; padding-left:16px; }
  #te-integrated-flow .event { margin-bottom:14px; position:relative; }
  #te-integrated-flow .event::before { content:""; position:absolute; left:-22px; top:4px; width:10px; height:10px; background:var(--te-accent); border-radius:50%; }
  #te-integrated-flow .screen { animation:te-shift .15s ease-out; }
  @keyframes te-shift { from { opacity:.65; transform:translateY(2px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce) { #te-integrated-flow .screen { animation:none; } }
  @media (max-width:760px) {
    #te-integrated-flow .work { grid-template-columns:1fr; }
    #te-integrated-flow .side { border-right:0; border-bottom:1px solid var(--te-border); }
    #te-integrated-flow .facts { grid-template-columns:1fr 1fr; }
    #te-integrated-flow .position { grid-template-columns:1fr 1fr; }
    #te-integrated-flow .columns { grid-template-columns:1fr; }
    #te-integrated-flow .mode { display:none; }
  }
</style>

<script>
  (() => {
    const root = document.getElementById('te-integrated-flow');
    const host = root.querySelector('#te-integrated-host');
    const tabs = [...root.querySelectorAll('[data-view]')];
    const render = (name) => {
      const template = root.querySelector(`#te-view-${name}`);
      if (!(template instanceof HTMLTemplateElement)) return;
      host.replaceChildren(template.content.cloneNode(true));
      const activeReview = name === 'long-plan' ? 'leaps' : name === 'existing-plan' ? 'coverage' : ['record', 'import'].includes(name) ? 'plan' : name;
      tabs.forEach(tab => tab.setAttribute('aria-pressed', String(tab.dataset.view === activeReview)));
      root.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => render(button.dataset.go)));
      const nav = root.querySelectorAll('[data-nav]');
      const screenerViews = ['screener', 'leaps', 'plan', 'long-plan'];
      nav.forEach(item => item.classList.toggle('active', item.dataset.nav === (screenerViews.includes(name) ? 'screener' : 'portfolio')));
    };
    tabs.forEach(tab => tab.addEventListener('click', () => render(tab.dataset.view)));
    render('screener');
  })();
</script>
